# Render (render.com) → New → Blueprint → este repositório: cria o servidor do app, grátis.
# Ele baixa o áudio do vídeo da música para a IA escrever a partitura (yt-dlp) e responde à API /api/*.
services:
  - type: web
    name: songbook-audio
    runtime: docker
    plan: free
    branch: ccr-59dd75f2-oirnca
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      # sites que podem pedir o áudio (o app no GitHub Pages)
      - key: ORIGENS_AUDIO
        value: https://kvsl11.github.io
      # se o YouTube bloquear ("confirme que não é um robô"): cole aqui o conteúdo de um cookies.txt de uma conta
      - key: YTDLP_COOKIES
        sync: false
