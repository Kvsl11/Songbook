<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Songbook Litúrgico</title>
  <meta name="description" content="Cifras, repertórios e liturgia diária para ministérios de música católica">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Navegação principal">
      <a class="brand" href="#/" aria-label="Início">
        <img src="icon.svg" alt="" width="34" height="34">
        <span><b>Songbook</b><small>Litúrgico</small></span>
      </a>
      <a href="#/" data-tab="biblioteca"><span data-icon="music"></span><em>Músicas</em></a>
      <a href="#/repertorios" data-tab="repertorios"><span data-icon="list"></span><em>Repertórios</em></a>
      <a href="#/liturgia" data-tab="liturgia"><span data-icon="cross"></span><em>Liturgia</em></a>
      <a href="#/ajustes" data-tab="ajustes"><span data-icon="settings"></span><em>Ajustes</em></a>
    </nav>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn" id="btn-back" aria-label="Voltar" hidden></button>
        <div class="titles">
          <small id="eyebrow"></small>
          <h1 id="title">Songbook</h1>
        </div>
        <div class="topbar-actions" id="top-actions"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".cho,.chopro,.chordpro,.crd,.pro,.txt,.json,.onsong" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
