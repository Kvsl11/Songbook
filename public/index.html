<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Songbook Litúrgico</title>
  <meta name="description" content="Cifras, letras, referências no YouTube e a liturgia do dia para ministérios de música católica">
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#/" aria-label="Início">
        <img src="icon.svg" alt="" width="32" height="32">
        <span>Songbook</span>
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <a href="#/" data-tab="inicio"><span data-icon="home"></span><em>Início</em></a>
        <a href="#/buscar" data-tab="buscar"><span data-icon="search"></span><em>Buscar</em></a>
        <a href="#/biblioteca" data-tab="biblioteca"><span data-icon="library"></span><em>Biblioteca</em></a>
        <a href="#/liturgia" data-tab="liturgia"><span data-icon="cross"></span><em>Liturgia</em></a>
      </nav>
      <div class="side-lib">
        <div class="side-lib-head"><span data-icon="library"></span><b>Seus repertórios</b><a href="#/biblioteca/repertorios" class="icon-btn" aria-label="Ver todos"><span data-icon="next"></span></a></div>
        <div id="side-sets"></div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn round" id="btn-back" aria-label="Voltar" hidden></button>
        <div class="titles">
          <small id="eyebrow"></small>
          <h1 id="title">Songbook</h1>
        </div>
        <div class="topbar-actions" id="top-actions"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="player" class="player" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".cho,.chopro,.chordpro,.crd,.pro,.txt,.json,.onsong" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
