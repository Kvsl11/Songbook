<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Songbook Litúrgico</title>
  <meta name="description" content="Cifras, repertórios e liturgia diária para ministérios de música católica">
  <meta name="theme-color" content="#1f2a44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Voltar" hidden>←</button>
    <h1 id="title">Songbook</h1>
    <div class="topbar-actions" id="top-actions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#/" data-tab="biblioteca"><span>♪</span>Músicas</a>
    <a href="#/repertorios" data-tab="repertorios"><span>☰</span>Repertórios</a>
    <a href="#/liturgia" data-tab="liturgia"><span>✝</span>Liturgia</a>
    <a href="#/ajustes" data-tab="ajustes"><span>⚙</span>Ajustes</a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".cho,.chopro,.chordpro,.crd,.pro,.txt,.json,.onsong" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
