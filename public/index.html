<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <script>
    // aplica tema e cor salvos antes de desenhar a página (evita "piscar")
    try {
      var p = (JSON.parse(localStorage.getItem('songbook.v1') || '{}').prefs) || {};
      var t = p.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (p.theme || 'dark');
      document.documentElement.dataset.theme = t;
      if (p.sideCollapsed) document.documentElement.classList.add('side-collapsed');
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Songbook Litúrgico</title>
  <meta name="description" content="Cifras, letras, referências no YouTube e a liturgia do dia para ministérios de música católica">
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg?v=7" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon-v7.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Songbook">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand-row">
        <a class="brand" href="#/" aria-label="Início"><span id="brand-logo"></span><span class="brand-name">Songbook<small>Litúrgico</small></span></a>
        <button class="icon-btn" id="btn-side" aria-label="Recolher menu" title="Recolher menu"><span data-icon="sidebar"></span></button>
      </div>
      <nav class="nav" aria-label="Navegação principal">
        <a href="#/" data-tab="inicio" data-tip="Início"><span data-icon="home"></span><em>Início</em></a>
        <a href="#/buscar" data-tab="buscar" data-tip="Buscar cantos"><span data-icon="search"></span><em>Buscar</em></a>
        <a href="#/biblioteca" data-tab="biblioteca" data-tip="Sua biblioteca"><span data-icon="library"></span><em>Biblioteca</em></a>
        <a href="#/oracoes" data-tab="oracoes" data-tip="Liturgia do dia, orações e hinários"><span data-icon="book"></span><em>Orações</em></a>
      </nav>
      <div class="side-lib">
        <div class="side-lib-head"><span data-icon="library"></span><b>Seus repertórios</b><a href="#/biblioteca/repertorios" class="icon-btn" aria-label="Ver todos"><span data-icon="next"></span></a></div>
        <div id="side-sets"></div>
        <div class="side-foot">
          <a class="icon-btn" href="#/ajustes" aria-label="Ajustes" title="Ajustes"><span data-icon="settings"></span></a>
        </div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn round" id="btn-back" aria-label="Voltar" hidden></button>
        <div class="titles">
          <small id="eyebrow"></small>
          <h1 id="title">Songbook</h1>
        </div>
        <div class="topbar-actions" id="top-actions"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".cho,.chopro,.chordpro,.crd,.pro,.txt,.json,.onsong" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
