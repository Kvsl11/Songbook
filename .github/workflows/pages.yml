# Publica a pasta public/ no GitHub Pages a cada push e uma vez por dia.
# Na publicação, copia do musicasparamissa.com.br as sugestões e cifras das próximas datas
# (o site não permite acesso direto pelo navegador), e do pocketterco.com.br o missal do dia e as orações.
# Antes do primeiro uso: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master, ccr-59dd75f2-oirnca]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *' # todo dia às 04h23 (Brasília)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache das cifras do Músicas para Missa
        uses: actions/cache@v4
        with:
          path: .mpm-cache
          key: mpm-${{ github.run_id }}
          restore-keys: mpm-
      - name: Copiar sugestões e cifras do Músicas para Missa
        continue-on-error: true # se o site estiver fora do ar, o app é publicado mesmo assim
        timeout-minutes: 25
        run: node scripts/mpm-sync.mjs --dias 12 --max 700
      - name: Cache das orações do Pocket Terço
        uses: actions/cache@v4
        with:
          path: .pt-cache
          key: pt-${{ github.run_id }}
          restore-keys: pt-
      - name: Copiar missal do dia, orações (Pocket Terço) e fontes (Junior Música Católica)
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/liturgia-sync.mjs --dias 21
      - name: Indexar o acervo litúrgico (pasta do Google Drive)
        if: github.event_name != 'push' # os dados do acervo ficam salvos no repositório: só na atualização diária
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/acervo-sync.mjs
      - name: Cache das letras do Hinário Litúrgico da CNBB
        if: github.event_name != 'push' # os dados do acervo ficam salvos no repositório: só na atualização diária
        uses: actions/cache@v4
        with:
          path: .hinario-cache
          key: hinario-${{ github.run_id }}
          restore-keys: hinario-
      - name: Letras do Hinário Litúrgico da CNBB (cadernos do acervo)
        if: github.event_name != 'push' # os dados do acervo ficam salvos no repositório: só na atualização diária
        continue-on-error: true
        timeout-minutes: 25
        run: |
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/hinario-sync.mjs
      - name: Cache das músicas do acervo
        if: github.event_name != 'push' # os dados do acervo ficam salvos no repositório: só na atualização diária
        uses: actions/cache@v4
        with:
          path: .acervo-cache
          key: acervo-${{ github.run_id }}
          restore-keys: acervo-
      - name: Músicas e partituras dos arquivos do acervo
        if: github.event_name != 'push' # os dados do acervo ficam salvos no repositório: só na atualização diária
        continue-on-error: true
        timeout-minutes: 60
        run: |
          command -v pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/cantos-sync.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
