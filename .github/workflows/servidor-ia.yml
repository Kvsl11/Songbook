# Publica o servidor da IA (pasta servidor-ia/) no Modal (modal.com): US$ 30 de uso grátis por mês, endereço https,
# liga só quando alguém usa. Publica de novo a cada mudança na pasta; no fim, a publicação do app (GitHub Pages)
# roda sozinha e grava o endereço para o app achar o servidor.
# Antes do primeiro uso, uma vez: entre em modal.com com a conta do GitHub, crie um token em
# modal.com/settings/tokens → New token e guarde os dois valores no GitHub em
# Settings → Secrets and variables → Actions → New repository secret: MODAL_TOKEN_ID e MODAL_TOKEN_SECRET.
# Opcionais, no mesmo lugar: ANTHROPIC_API_KEY (liga o "Tirar dúvidas") e YT_COOKIES (o conteúdo do cookies.txt,
# para vídeos do YouTube com restrição de idade).
name: Publicar o servidor da IA

on:
  push:
    branches: [main, master, ccr-59dd75f2-oirnca]
    paths: ['servidor-ia/**', '.github/workflows/servidor-ia.yml']
  workflow_dispatch:
  # toda semana: lê os PDFs novos do acervo e publica de novo (o Lumen passa a saber o que entrou no Drive)
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: servidor-ia
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
    steps:
      - uses: actions/checkout@v4
      - name: Sem o token do Modal
        if: env.MODAL_TOKEN_ID == '' || env.MODAL_TOKEN_SECRET == ''
        run: echo "::notice::Guarde o token do Modal nos secrets MODAL_TOKEN_ID e MODAL_TOKEN_SECRET para publicar o servidor da IA (veja o topo deste arquivo)."
      - uses: actions/setup-python@v5
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        with:
          python-version: '3.11'
      # o texto dos PDFs do acervo do Drive, para o Lumen responder com o que está dentro deles: fica guardado entre as
      # publicações (cache) e cada vez lê até 800 arquivos novos, então os ~2 mil do acervo entram em poucas rodadas
      - name: Texto guardado dos PDFs do acervo
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        uses: actions/cache@v4
        with:
          path: servidor-ia/textos-acervo.jsonl
          key: textos-acervo-${{ github.run_id }}
          restore-keys: textos-acervo-
      - name: Ler o texto dos PDFs do acervo (Drive)
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != '' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        timeout-minutes: 30
        working-directory: servidor-ia
        run: |
          pip install -q pypdf
          python indexar_acervo.py --max 800 2>&1 | tail -5
          [ -f textos-acervo.jsonl ] && echo "::notice::$(wc -l < textos-acervo.jsonl) arquivos do acervo com o texto lido"
      - name: Publicar no Modal
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        working-directory: servidor-ia
        run: |
          pip install -q modal
          # os segredos do servidor (o Modal pede pelo menos um valor)
          args=(IA_PUBLICADO=1)
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$YT_COOKIES" ] && args+=("YT_COOKIES=$YT_COOKIES")
          modal secret create songbook-ia "${args[@]}" --force > /dev/null
          modal deploy modal_app.py
          url=$(python -c "import modal; print(modal.Function.from_name('songbook-ia', 'web').get_web_url())")
          echo "::notice::Servidor da IA no ar: $url"
